<header class="modern-header-wrapper">
  <nav class="modern-navbar" role="navigation">
    <div class="nav-container">
      <a class="nav-brand" routerLink="/" (click)="closeMenu()">
        <div class="brand-logo-wrap">
          <img src="../../../../assets/img/common/minimart-logo.png" alt="Jaspilite Logo" class="brand-img" />
        </div>
        <div class="brand-text-wrap">
          <span class="brand-name">Jaspilite</span>
          <span class="brand-sub"><span class="status-dot"></span>Grocery & Food</span>
        </div>
      </a>

      <!-- Mobile Hamburger Toggle -->
      <button class="mobile-toggle-btn" (click)="toggleMenu()" aria-label="Toggle navigation">
        <i class="fa" [ngClass]="isCollapsed ? 'fa-bars' : 'fa-times'"></i>
      </button>

      <!-- Nav Links -->
      <div class="nav-menu" [class.show-mobile]="!isCollapsed">
        <ul class="nav-links">
          <li>
            <a class="nav-item" routerLink="/online-food-and-grocery-mobile-app" routerLinkActive="active" (click)="closeMenu()">Home</a>
          </li>
          <li>
            <a class="nav-item" routerLink="/about-jaspilite-mobile-app" routerLinkActive="active" (click)="closeMenu()">About Us</a>
          </li>
          <li>
            <a class="nav-item" routerLink="/contact-jaspilite-mobile-app-team" routerLinkActive="active" (click)="closeMenu()">Contact Us</a>
          </li>
          <li>
            <a class="nav-item" routerLink="/how-to-become-a-partner" routerLinkActive="active" (click)="closeMenu()">Become a Partner</a>
          </li>
          <li>
            <a class="nav-item" routerLink="/jaspilite-jobs" routerLinkActive="active" (click)="closeMenu()">Jobs</a>
          </li>
          <li>
            <a class="nav-item" routerLink="/promo-codes" routerLinkActive="active" (click)="closeMenu()">
              Promo Codes
              <span class="nav-chip">Offers</span>
            </a>
          </li>
          <li>
            <a class="nav-item" routerLink="/faq" routerLinkActive="active" (click)="closeMenu()">FAQ</a>
          </li>
        </ul>

        <div class="nav-actions">
          <button type="button" class="admin-portal-btn" (click)="continueFun(); closeMenu()">
            <i class="fa fa-lock"></i>
            <span>Admin Portal</span>
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>
